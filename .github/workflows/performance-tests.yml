name: ParaBank Full Performance Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gatling-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: ${{ secrets.PERF_BASE_URL }}
      USERNAME: ${{ secrets.PERF_USERNAME }}
      PASSWORD: ${{ secrets.PERF_PASSWORD }}
      TRANSFER_FEEDER_ROWS: '5000'

    steps:
      - name: Checkout performance project
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate performance environment
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BASE_URL}" ]]; then
            echo "PERF_BASE_URL is not configured in GitHub Actions secrets."
            echo "Configure the authorized performance environment URL first."
            exit 2
          fi

          echo "Performance target configured."

      - name: Prepare test data
        shell: bash
        run: |
          chmod +x scripts/bootstrap-environment.sh
          ./scripts/bootstrap-environment.sh

      - name: Compile Gatling simulations
        run: mvn --batch-mode test-compile

      - name: Run full performance suite
        shell: bash
        run: |
          chmod +x scripts/run-all.sh
          ./scripts/run-all.sh full

      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-full-reports
          path: target/gatling/**
          if-no-files-found: warn
