name: ParaBank Full Performance Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gatling-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: http://127.0.0.1:8080/parabank/services/bank
      USERNAME: john
      PASSWORD: demo
      TRANSFER_FEEDER_ROWS: '400'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start local ParaBank
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/start-parabank-local.sh

      - name: Prepare test data
        shell: bash
        run: ./scripts/bootstrap-environment.sh

      - name: Run full Gatling suite
        shell: bash
        run: ./scripts/run-all.sh full

      - name: Save ParaBank logs
        if: always()
        shell: bash
        run: docker logs parabank-performance-lab > target/parabank.log 2>&1 || true

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-full-reports
          path: |
            target/gatling/**
            target/parabank.log
          if-no-files-found: ignore

      - name: Stop local ParaBank
        if: always()
        shell: bash
        run: ./scripts/stop-parabank-local.sh
