name: ParaBank Full Performance Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gatling-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: https://parabank.parasoft.com/parabank/services/bank
      USERNAME: john
      PASSWORD: demo
      TRANSFER_FEEDER_ROWS: '200'
      TEST_COOLDOWN_SECONDS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run full Gatling suite against production
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-production.sh full all

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-full-reports
          path: target/gatling/**
          if-no-files-found: ignore
