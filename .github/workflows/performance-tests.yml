name: ParaBank Full Performance Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gatling-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BASE_URL: http://localhost:8080/parabank/services/bank
      USERNAME: john
      PASSWORD: demo
      TRANSFER_FEEDER_ROWS: '5000'

    steps:
      - name: Checkout performance project
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start local ParaBank
        run: |
          chmod +x scripts/start-parabank-local.sh
          ./scripts/start-parabank-local.sh

      - name: Prepare test data
        run: |
          chmod +x scripts/bootstrap-environment.sh
          ./scripts/bootstrap-environment.sh

      - name: Compile Gatling simulations
        run: mvn --batch-mode test-compile

      - name: Run full performance suite
        run: |
          chmod +x scripts/run-all.sh
          ./scripts/run-all.sh full

      - name: Capture ParaBank logs
        if: always()
        run: docker logs parabank-performance-test > target/parabank.log 2>&1 || true

      - name: Upload Gatling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-full-reports
          path: |
            target/gatling/**
            target/parabank.log
          if-no-files-found: warn

      - name: Stop local ParaBank
        if: always()
        run: |
          chmod +x scripts/stop-parabank-local.sh
          ./scripts/stop-parabank-local.sh
